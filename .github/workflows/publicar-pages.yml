name: Atualizar dados e publicar GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "scripts/**"
      - "configs/**"
      - ".github/workflows/publicar-pages.yml"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar cache incremental do Limitless
        uses: actions/cache@v4
        with:
          path: .cache_limitless
          key: limitless-${{ runner.os }}-${{ hashFiles('configs/eras/standard-pitch-black.json') }}-${{ github.run_id }}
          restore-keys: |
            limitless-${{ runner.os }}-${{ hashFiles('configs/eras/standard-pitch-black.json') }}-

      - name: Coletar dados legados do Limitless
        env:
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
        run: >-
          python3 scripts/run_collection.py
          --era-config configs/eras/standard-pitch-black.json
          --output site

      - name: Converter CSVs em snapshot JSON
        run: >-
          python3 scripts/build_snapshot_from_csv.py
          --input site
          --output apps/web/public/data/v1
          --era-config configs/eras/standard-pitch-black.json

      - name: Disponibilizar CSVs no site
        run: |
          mkdir -p apps/web/public/downloads
          cp site/*.csv apps/web/public/downloads/

      - name: Arquivar CSVs da coleta
        uses: actions/upload-artifact@v4
        with:
          name: dados-limitless-csv
          path: site/*.csv
          if-no-files-found: error
          retention-days: 30

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: apps/web
        run: npm ci

      - name: Executar lint
        working-directory: apps/web
        run: npm run lint

      - name: Verificar tipos
        working-directory: apps/web
        run: npm run typecheck

      - name: Executar testes
        working-directory: apps/web
        run: npm run test

      - name: Verificar configuração opcional do login
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Login por e-mail ficará desabilitado neste deploy: configure NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY em Settings > Secrets and variables > Actions > Variables."
          else
            echo "Configuração pública do Supabase encontrada."
          fi

      - name: Gerar exportação estática do Next.js
        working-directory: apps/web
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
